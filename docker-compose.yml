name: banner-fingerprint

services:
  server:
    build: .
    command: /app/server -addr :8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Production hardening: read-only rootfs (only /tmp writable), drop all
    # Linux capabilities, forbid privilege escalation, reap zombies via init.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Runs once, sends the bundled sample data to the server, and prints the
  # recognized results (visible with `docker compose logs client`).
  client:
    build: .
    command: /app/client -input /data/input.json -server http://server:8080
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
